# Config file for the real data analysis
[script_parameters]
results_folder = results
data_folder = data
patient_specific_plots_folder = patient_specific_plots
shap_plots_folder = global_shapley_plots
latent_shap_plots_folder = latent_shapley_plots
shap_clustering_algorithm = hdbscan

[file_names]
path_to_features_data = genomics_data_ready.csv
path_to_metab_data = metab_data_ready.csv
path_to_clinical_data = clinical_data_ready.csv
path_to_gene_names = genes_names.csv
path_to_metabolites_names = metab_names.csv

[shared_columns]
patient_id = ID
patient_meal_id = ID_Meal
col_meal = Meal
col_visit = Visit
col_time = Time
col_outcome = TG

[arrays]
array_names = genes, metabolites, static_control_vars, y_baseline, y_target
col_genes = all
col_metabolites = all
col_static_control_vars = Sex, Age, BMI, Meal
col_y_baseline = TG
col_y_target = TG

[preprocess_arrays]
genes = all
metabolites = all
static_control_vars = Age, BMI
y_baseline = all
y_target = all

[saving_file_names]
pickle_predictions_val = pickle_predictions_val
pickle_ground_truth_val = pickle_ground_truth_val
pickle_best_epochs = pickle_best_epochs
pickle_all_train_losses = pickle_all_train_losses
pickle_all_val_losses = pickle_all_val_losses
pickle_all_scalers = pickle_all_scalers
pickle_model_dimension_definition = pickle_model_dimension_definition
pickle_shapley_values = pickle_shapley_values
pickle_shapley_values_arrays = pickle_shapley_values_arrays
pickle_predictions_base_shapley = pickle_predictions_base_shapley
pickle_cc_tau = pickle_cc_tau

[model_definition_parameters]
input_dim_genes = input_dim_genes
input_dim_metab = input_dim_metab
input_patient_features_dim = input_patient_features_dim
n_timepoints = n_timepoints

[training_parameters]
save_models = True
reduce_on_plateau = False
noisy_gradient = False
n_folds = 2
batch_size = 15
batch_size_val = None
num_epochs = 10
device = cpu
gradient_noise_std = 0.05
alpha_conf_pred = 0.05
use_cc_predictions = True

# model parameters divided in floats and integers
[model_params_int]
vae_genomics_input_to_latent_dim = 64
vae_genomics_latent_dim = 16
vae_metabolomics_input_to_latent_dim = 16
vae_metabolomics_latent_dim = 8
max_len_position_enc = 10
transformer_input_dim = 10
n_heads = 1
transformer_dim_feedforward = 10

[model_params_floats]
dropout = 0.1
dropout_attention = 0.1
kl_weight = 1.0
